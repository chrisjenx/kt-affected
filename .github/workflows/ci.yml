name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The library as a dependency sees it: `default-features = false`, no CLI.
      - run: cargo clippy --locked --lib --no-default-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90" # keep in sync with rust-version in Cargo.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked

  # Static discovery of pinned open-source KMP builds must match the committed goldens, so any change
  # to what discovery sees shows up as a reviewable diff. Their Gradle is never run.
  discovery-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - run: scripts/oss-golden.sh target/release/kt-affected

  # The per-change accuracy gate: re-select the public replay's PRs whose real CI failures
  # kt-affected catches (none may be lost) and a committed sample of selections (a change shows as a
  # diff to review). Frozen CI evidence in replay/frozen/, no GitHub API; the projects' Gradle is
  # never run. The full window runs in the Replay workflow after merge and before a release.
  replay-check:
    strategy:
      fail-fast: false
      matrix:
        target: [circuit, element-x-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: .replay/repos/${{ matrix.target }}
          key: replay-repo-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: replay-repo-${{ matrix.target }}-
      - run: python3 replay/replay.py check ${{ matrix.target }} --workers 3
