name: Replay

# The full public accuracy replay over the committed window (replay/frozen/): every merged PR is
# re-selected, sharded across runners, then scored against the CI failures those PRs really had.
# Runs after every merge to main and before a release; fails when kt-affected catches fewer real
# failures than the committed results. The projects' Gradle is never run.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: replay-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  select:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: circuit, shard: 1/1 }
          - { target: element-x-android, shard: 1/4 }
          - { target: element-x-android, shard: 2/4 }
          - { target: element-x-android, shard: 3/4 }
          - { target: element-x-android, shard: 4/4 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .replay/repos/${{ matrix.target }}
          key: replay-repo-${{ matrix.target }}-${{ github.run_id }}-${{ strategy.job-index }}
          restore-keys: replay-repo-${{ matrix.target }}-
      - run: python3 replay/replay.py run ${{ matrix.target }} --frozen --shard ${{ matrix.shard }} --workers 3 --shard-out shards
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ strategy.job-index }}
          path: shards/

  score:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        target: [circuit, element-x-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache/restore@v4
        with:
          path: .replay/repos/${{ matrix.target }}
          key: replay-repo-${{ matrix.target }}-
          restore-keys: replay-repo-${{ matrix.target }}-
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true
      - run: python3 replay/replay.py run ${{ matrix.target }} --frozen --shards-from shards --out-date ci
      - name: Compare with the committed results
        run: python3 replay/replay.py compare ${{ matrix.target }} --out-date ci >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.target }}
          path: replay/results/${{ matrix.target }}/ci/
