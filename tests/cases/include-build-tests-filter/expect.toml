why = "An included build's registered Test task keeps its class filter, as in the root build: a class it excludes is never passed to that task, while the unfiltered `test` task still runs it."
must = ["demo.plugins.BuildVersionTest@:plugins:test", "demo.plugins.BuildVersionIT@:plugins:test", "demo.plugins.BuildVersionTest@:plugins:fastTest"]
never = ["demo.plugins.BuildVersionIT@:plugins:fastTest", "demo.plugins.JvmLibraryPluginTest"]
smoke_tasks = [":core:test"]
reasons = ["gradle/plugins/src/main/kotlin/demo/plugins/BuildVersion.kt: build logic"]
