why = "A module moved by `projectDir` is found at its new directory, and `projects.core.moneyModel` is a dependency on it: its dependent's test runs; a module off its classpath with a same-named class doesn't."
must = ["demo.model.MoneyTest@:core:money-model:test", "demo.billing.BillingTest@:feature:billing:test"]
never = ["demo.weather.WeatherTest"]
